; SkyEar gateway: ESP32 DevKit V1 (ESP32-WROOM-32)
; Library versions are the ones this firmware was compiled and linked against.
[env:gateway]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17 (IDF 4.4)
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I../common
lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
