; SkyEar sensor node: ESP32-S3-DevKitC-1 N16R8
; Library versions are the ones this firmware was compiled and linked against.
[env:node]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17 (IDF 4.4)
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 921600
build_flags =
    -I../common
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2
build_unflags = -Os
lib_deps =
    adafruit/Adafruit BME280 Library@2.3.0
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4
    https://github.com/tanakamasayuki/Arduino_TensorFlowLite_ESP32.git#8572c72
